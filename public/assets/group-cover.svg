<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cover photograph for the Landing Group section.

  Stylised rendering of the shared headquarters: the NB Building, Ground Floor &
  2nd Floor, Ochoa Avenue, Butuan City — the address both VINCARE PHARMA and
  EXELMED PHARMA TRADE print on every receipt and licence. Delivered as SVG so a
  wide, cover-ratio panel is available without shipping a multi-megabyte photo;
  the component degrades gracefully if it is ever replaced with a real photo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img"
  aria-label="NB Building, Ground Floor &amp; 2nd Floor, Ochoa Avenue, Butuan City &mdash; Vincare Pharma and Exelmed Pharma Trade headquarters">
  <!-- Sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#cfe9f7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e3e8ef"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
    <filter id="glass-highlight" x="0" y="0" width="1" height="1">
      <feTurbulence type="turbulence" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Ground plane -->
  <rect x="0" y="510" width="1600" height="90" fill="#d7e3ec"/>

  <!-- Building shadow on the ground -->
  <ellipse cx="800" cy="516" rx="220" ry="10" fill="url(#shadow)" opacity="0.45"/>

  <!-- Building -->
  <rect x="540" y="140" width="520" height="370" rx="4" fill="url(#wall)" filter="url(#soft-shadow)"/>

  <!-- Ground-floor entrance: double doors + transom + pillars -->
  <rect x="660" y="388" width="280" height="122" fill="#fff" stroke="#c7d3e0" stroke-width="1"/>
  <rect x="660" y="388" width="140" height="122" fill="#eef3f8"/>
  <rect x="800" y="388" width="140" height="122" fill="#eef3f8"/>
  <line x1="730" y1="388" x2="730" y2="510" stroke="#c7d3e0" stroke-width="1"/>
  <rect x="660" y="368" width="280" height="20" fill="#eef3f8" stroke="#c7d3e0" stroke-width="1"/>
  <!-- Door handles -->
  <circle cx="700" cy="448" r="5" fill="#889bb7"/>
  <circle cx="760" cy="448" r="5" fill="#889bb7"/>
  <!-- Steps -->
  <polygon points="800,510 770,510 760,495 840,495 830,510 800,510" fill="#c7d3e0"/>

  <!-- First-floor windows -->
  <rect x="600" y="190" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>
  <rect x="760" y="190" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>
  <rect x="920" y="190" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>
  <rect x="600" y="320" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>
  <rect x="760" y="320" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>
  <rect x="920" y="320" width="80" height="100" fill="#bcd5f0" stroke="#a3c4de" stroke-width="1"/>

  <!-- Second-floor facade band (Exelmed / Vincare trading floors) -->
  <rect x="540" y="150" width="520" height="40" fill="#fff" opacity="0.6" stroke="#e3e8ef" stroke-width="1"/>
  <text x="1060" y="180" text-anchor="end" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#5b6b7f">Vincare &amp; Exelmed</text>

  <!-- Roof -->
  <polygon points="530,138 1070,138 1085,155 515,155" fill="#7b8fa9" opacity="0.9"/>

  <!-- Signage on the ground-floor transom -->
  <text x="800" y="396" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="500" fill="#2c3e50">NB Building</text>
  <text x="800" y="420" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b7c92">Ground Floor &amp; 2nd Floor</text>
  <text x="800" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b7c92">Ochoa Avenue, Butuan City</text>

  <!-- Foreground: two people / trolleys suggesting activity -->
  <g fill="#4a5d73">
    <rect x="300" y="470" width="24" height="24" rx="4"/>
    <rect x="330" y="474" width="36" height="16" rx="3"/>
    <rect x="304" y="456" width="8" height="14" rx="2"/>
    <rect x="400" y="478" width="20" height="18" rx="4"/>
    <rect x="424" y="482" width="32" height="14" rx="3"/>
    <rect x="410" y="462" width="6" height="16" rx="2"/>
  </g>
</svg>
